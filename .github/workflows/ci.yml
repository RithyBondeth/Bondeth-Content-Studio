name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Run by hand from the Actions tab. With "update snapshots" ticked, the
  # snapshot job writes new reference images and uploads them as an artifact.
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate the reference images in snapshots/linux/
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Node 22 LTS: `npm test` passes glob patterns to `node --test`, which needs Node 21+.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  render:
    name: Test render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shared libraries Chrome Headless Shell needs on Ubuntu (see remotion.dev/docs/miscellaneous/linux-dependencies).
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure
      # The first two seconds of one bundled example, enough to catch a broken composition.
      - name: Render example
        run: npx remotion render src/index.ts why-is-the-sky-blue-landscape out/ci-render.mp4 --frames=0-59
      - uses: actions/upload-artifact@v6
        with:
          name: ci-render
          path: out/ci-render.mp4
          retention-days: 7

  snapshots:
    name: Visual snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UPDATE: ${{ inputs.update-snapshots && '--update' || '' }}
    steps:
      - uses: actions/checkout@v5
      # The same image `npm run snapshots:docker` uses, so CI renders the same pixels as a local Linux run.
      - name: Build the snapshot image
        run: docker build -t content-studio-snapshots -f snapshots/Dockerfile .
      - name: Render and compare with snapshots/linux/
        run: docker run --rm -v "$PWD":/app -v /app/node_modules content-studio-snapshots npm run snapshots -- $UPDATE
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-diffs
          path: out/snapshots/
          retention-days: 7
      - name: Upload new reference images
        if: inputs.update-snapshots
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-references
          path: snapshots/linux/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build the server image
        run: docker build -t content-studio .
      # Starts it with accounts on and checks sign-in is required, then renders a short clip inside it.
      - name: Smoke test
        run: |
          docker run -d --name studio -p 3100:3100 --init --shm-size 1g \
            -e BETTER_AUTH_SECRET=ci-secret-not-for-production \
            -e BETTER_AUTH_URL=http://localhost:3100 content-studio
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/login && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/)" = 307
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/files/x.mp4)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/login)" = 200
          docker exec studio npx remotion render src/index.ts why-is-the-sky-blue-landscape /data/out/ci.mp4 --frames=0-29
      - name: Server logs
        if: failure()
        run: docker logs studio
