name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Node 22 LTS: `npm test` passes glob patterns to `node --test`, which needs Node 21+.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  render:
    name: Test render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shared libraries Chrome Headless Shell needs on Ubuntu (see remotion.dev/docs/miscellaneous/linux-dependencies).
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure
      # The first two seconds of one bundled example, enough to catch a broken composition.
      - name: Render example
        run: npx remotion render src/index.ts why-is-the-sky-blue-landscape out/ci-render.mp4 --frames=0-59
      - uses: actions/upload-artifact@v5
        with:
          name: ci-render
          path: out/ci-render.mp4
          retention-days: 7
